name: Site quality checks

on:
  push:
    branches: ["文藝廳"]
  pull_request:
    branches: ["文藝廳"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate pages, metadata, links, sitemap and CSS
        run: node scripts/check-site.mjs
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          shopt -s nullglob
          files=( *.js )
          if (("${#files[@]}" == 0)); then
            echo "No JavaScript files found."
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done
